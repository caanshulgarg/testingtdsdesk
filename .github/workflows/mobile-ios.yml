# FinCom for iPhone and iPad (branch next-mobile; the mobile plan, mobile-plan.md): the user app (app/) in its Capacitor
# shell (mobile/), built on GitHub's macOS machine into an IPA (what TestFlight and the App Store take).
#   By hand only (Actions tab → "FinCom phone app (iOS)" → Run workflow): never on a push. macOS minutes count ten times
#   Linux minutes on a private repository: about 20 to 30 minutes a run, so each run costs some 200 to 300 of the month's
#   minutes (the plan's "Build and release" has the estimate). Run it for a release, not for every change.
#   Signing: with the IOS_* secrets (mobile-plan.md, "Secrets") the app is signed for the App Store and an IPA is made;
#   without them the project is only compiled (no signing, for the simulator) to show it builds, and the log says so.
#   Nothing is sent to Apple unless "Send to TestFlight" is ticked and the APP_STORE_CONNECT_* secrets are set.
#   The files are kept 3 days (artifacts), then gone.
name: FinCom phone app (iOS)

on:
  workflow_dispatch:
    inputs:
      database:
        description: "Which database the app uses: staging (testers) or live (the store build)"
        type: choice
        options: [staging, live]
        default: staging
      version_name:
        description: "Version shown in the App Store, e.g. 1.0.0 (empty: 0.1.<run number>)"
        required: false
        default: ""
      testflight:
        description: "Send the signed IPA to TestFlight (App Store Connect)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      FINCOM_MOBILE_DB: ${{ inputs.database == 'staging' && 'staging' || 'live' }}
      IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
      IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
      IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
      GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            mobile/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Xcode (the newest on the machine)
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Packages (app and mobile, exactly as locked)
        run: |
          (cd app && npm ci --no-audit --no-fund)
          (cd mobile && npm ci --no-audit --no-fund)
      - name: The phone's copy of FinCom
        run: node mobile/scripts/build-web.mjs ${{ inputs.database == 'staging' && '--staging' || '' }}
      - name: The iOS project (made by Capacitor when it is not in the repository yet), patched, synced
        working-directory: mobile
        run: |
          node scripts/add-platforms.mjs ios
          npx cap sync ios
      - name: The testing flavour (staging) - its own bundle id and name, so it sits beside the real app
        if: inputs.database == 'staging'
        working-directory: mobile/ios/App
        run: |
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = live.fincom.app;/PRODUCT_BUNDLE_IDENTIFIER = live.fincom.app.staging;/g' App.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName FinCom (testing)" App/Info.plist
      - name: Firebase's GoogleService-Info.plist (push through FCM); without it push stays off
        working-directory: mobile/ios/App/App
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > GoogleService-Info.plist; echo "GoogleService-Info.plist written";
          else echo "::notice::No GOOGLE_SERVICE_INFO_PLIST secret: the app is built without push notifications"; echo '{"push":"off"}' > public/push-off.json; fi
      - name: Version (the build number = the run number, always higher than the last)
        working-directory: mobile/ios/App
        run: |
          NAME="${{ inputs.version_name }}"; [ -n "$NAME" ] || NAME="0.1.${{ github.run_number }}"
          BUILD=$(( 1000 + ${{ github.run_number }} ))
          sed -i '' -E "s/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = $NAME;/g; s/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = $BUILD;/g" App.xcodeproj/project.pbxproj
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
      - name: Decide whether to sign
        run: |
          if [ -n "$IOS_DIST_CERT_P12_BASE64" ] && [ -n "$IOS_DIST_CERT_PASSWORD" ] && [ -n "$IOS_PROVISION_PROFILE_BASE64" ] && [ -n "$IOS_TEAM_ID" ]; then
            echo "SIGN=1" >> "$GITHUB_ENV"
          else
            echo "::warning::The IOS_DIST_CERT_P12_BASE64, IOS_DIST_CERT_PASSWORD, IOS_PROVISION_PROFILE_BASE64 and IOS_TEAM_ID secrets are not all set: signing skipped. The project is compiled for the simulator only, to show it builds; no IPA. mobile-plan.md says how to add them."
            echo "SIGN=0" >> "$GITHUB_ENV"
          fi
      - name: Unsigned check build (simulator)
        if: env.SIGN == '0'
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build | tail -40
          mkdir -p "$GITHUB_WORKSPACE/out"
          (cd "$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator" && zip -qr "$GITHUB_WORKSPACE/out/FinCom-$VERSION_NAME-$FINCOM_MOBILE_DB-simulator-unsigned.zip" App.app)
      - name: The signing certificate and profile, in a keychain of this run only
        if: env.SIGN == '1'
        run: |
          KC="$RUNNER_TEMP/fincom.keychain-db"; KCP="$(openssl rand -hex 16)"
          security create-keychain -p "$KCP" "$KC"; security set-keychain-settings -lut 3600 "$KC"; security unlock-keychain -p "$KCP" "$KC"
          printf '%s' "$IOS_DIST_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCP" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$IOS_PROVISION_PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/fincom.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/fincom.mobileprovision" | plutil -extract UUID raw -)
          NAME=$(security cms -D -i "$RUNNER_TEMP/fincom.mobileprovision" | plutil -extract Name raw -)
          cp "$RUNNER_TEMP/fincom.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/dist.p12"
      - name: Signed archive and IPA (App Store)
        if: env.SIGN == '1'
        working-directory: mobile/ios/App
        run: |
          BUNDLE=$( [ "$FINCOM_MOBILE_DB" = staging ] && echo live.fincom.app.staging || echo live.fincom.app )
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FinCom.xcarchive" -derivedDataPath "$RUNNER_TEMP/dd" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive | tail -40
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/FinCom.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/ipa" | tail -20
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$RUNNER_TEMP"/ipa/*.ipa "$GITHUB_WORKSPACE/out/FinCom-$VERSION_NAME-$FINCOM_MOBILE_DB.ipa"
      - name: Remove this run's keychain
        if: always() && env.SIGN == '1'
        run: security delete-keychain "$RUNNER_TEMP/fincom.keychain-db" || true
      - uses: actions/upload-artifact@v4
        with:
          name: fincom-ios-${{ env.FINCOM_MOBILE_DB }}-${{ github.run_number }}
          path: out/
          if-no-files-found: error
          retention-days: 3
      - name: TestFlight
        if: inputs.testflight
        run: |
          if [ "$SIGN" != 1 ] || [ -z "$APP_STORE_CONNECT_KEY_ID" ] || [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] || [ -z "$APP_STORE_CONNECT_KEY_P8" ]; then
            echo "::warning::Not sent to TestFlight: the app was not signed, or the APP_STORE_CONNECT_KEY_ID / _ISSUER_ID / _KEY_P8 secrets are not set (mobile-plan.md, 'Secrets')"; exit 0; fi
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APP_STORE_CONNECT_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8"
          xcrun altool --upload-app --type ios --file out/*.ipa --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8"
