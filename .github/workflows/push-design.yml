# Push-design measurements (MEASUREMENT ONLY, branch tally-versions): the owner's "push, do not pull" design timed on
# real TallyPrime releases. Each release installed as tally-versions.yml does (Tally's own download centre, Educational
# mode, driven by keys); then .github/tally-spike/push/pushm.ps1: save times with no add-on / stamps / today's heads-only
# add-on / a full-entry add-on (FCPFull.tdl, never shipped), FinCom's posting through bridge 2.3.0 with each, and the
# full-entry lines against Tally's own ids. The releases and sizes come from .github/tally-spike/push/run.txt.
# Results are committed back to tally-versions: spike-results/push-design/<run>-<release>/ and the captures under
# bridge-go/testdata/push-design/<release>/.
name: Push design
on:
  push:
    branches: [tally-versions]
    paths: ['.github/workflows/push-design.yml', '.github/tally-spike/push/**']
permissions:
  contents: write
concurrency:
  group: push-design-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      versions: ${{ steps.plan.outputs.versions }}
      reps: ${{ steps.plan.outputs.reps }}
      posts: ${{ steps.plan.outputs.posts }}
      led: ${{ steps.plan.outputs.led }}
      item: ${{ steps.plan.outputs.item }}
      vch: ${{ steps.plan.outputs.vch }}
      hmin: ${{ steps.plan.outputs.hmin }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - id: plan
        run: |
          f=harness/.github/tally-spike/push/run.txt
          get() { grep -E "^$1=" "$f" | head -1 | cut -d= -f2 | tr -d '[:space:]'; }
          v=$(get versions); v=${v:-7.1}
          echo "versions=$(echo "$v" | awk -F, '{printf "["; for(i=1;i<=NF;i++){printf "%s\"%s\"", (i>1?",":""), $i}; printf "]"}')" | tee -a "$GITHUB_OUTPUT"
          echo "reps=$(get reps)" | tee -a "$GITHUB_OUTPUT"; echo "posts=$(get posts)" | tee -a "$GITHUB_OUTPUT"
          echo "led=$(get heavy_led)" | tee -a "$GITHUB_OUTPUT"; echo "item=$(get heavy_item)" | tee -a "$GITHUB_OUTPUT"
          echo "vch=$(get heavy_vch)" | tee -a "$GITHUB_OUTPUT"; echo "hmin=$(get heavy_min)" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: tax-accuracy
      - id: sha
        run: |
          echo "sha=$(git rev-parse HEAD)" | tee -a "$GITHUB_OUTPUT"
          git log -1 --format='bridge source: %H %s' | tee bridge-source.txt
      - name: Committed 2.3.0 setup at tax-accuracy
        run: |
          f=$(ls assets-test/bridge-go/FinComBridge-Setup-*.exe | head -1)
          want=$(awk '{print tolower($1); exit}' "$f.sha256"); got=$(sha256sum "$f" | awk '{print $1}')
          echo "committed setup $f: SHA-256 $got (expected $want)"
          [ "$want" = "$got" ] || { echo "::error::committed setup SHA-256 mismatch"; exit 1; }
          mkdir -p bridge-go/dist && cp "$f" bridge-go/dist/ && cp bridge-go/addon/FinComRecorder.tdl bridge-source.txt bridge-go/dist/
          echo "setup origin: COMMITTED $f SHA-256 $got" | tee bridge-go/dist/setup-origin.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-dist
          path: bridge-go/dist/
          if-no-files-found: error

  tally:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.build.outputs.versions) }}
    runs-on: windows-latest
    timeout-minutes: 330
    env:
      TALLY_REL: ${{ matrix.version }}
      RES: ${{ github.workspace }}\spike-results\push-design\${{ github.run_id }}-${{ matrix.version }}
      SHOTS: ${{ github.workspace }}\spike-results\push-design\${{ github.run_id }}-${{ matrix.version }}\shots
      LOG: ${{ github.workspace }}\spike-results\push-design\${{ github.run_id }}-${{ matrix.version }}\log.txt
      BRIDGE_SHA: ${{ needs.build.outputs.sha }}
      PD_REPS: ${{ needs.build.outputs.reps }}
      PD_POSTS: ${{ needs.build.outputs.posts }}
      PD_HEAVY_LED: ${{ needs.build.outputs.led }}
      PD_HEAVY_ITEM: ${{ needs.build.outputs.item }}
      PD_HEAVY_VCH: ${{ needs.build.outputs.vch }}
      PD_HEAVY_MIN: ${{ needs.build.outputs.hmin }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bridge-dist
          path: bridge-dist
      - name: Desktop check
        run: |
          New-Item -ItemType Directory -Force $env:RES, $env:SHOTS | Out-Null
          & { "== TallyPrime $env:TALLY_REL push-design"; whoami; Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version | Out-String
              Get-CimInstance Win32_Processor | Select-Object Name, NumberOfLogicalProcessors | Out-String } *>&1 | Tee-Object -FilePath $env:LOG -Append
          exit 0
      - name: 1 Installer from Tally's download centre
        id: dl
        timeout-minutes: 20
        run: |
          & .github/tally-spike/resolvev.ps1 *>&1 | Tee-Object -FilePath $env:LOG -Append; exit $LASTEXITCODE
      - name: 2 Install
        id: inst
        timeout-minutes: 15
        run: |
          & .github/tally-spike/installv.ps1 *>&1 | Tee-Object -FilePath $env:LOG -Append; exit $LASTEXITCODE
      - name: 3 Start Tally, company (flow.ps1)
        timeout-minutes: 15
        continue-on-error: true
        run: |
          & .github/tally-spike/flow.ps1 *>&1 | Tee-Object -FilePath $env:LOG -Append; exit 0
      - name: 4 Measurements (pushm.ps1)
        timeout-minutes: 280
        continue-on-error: true
        env:
          BRIDGE_DIST: ${{ github.workspace }}\bridge-dist
        run: |
          & .github/tally-spike/push/pushm.ps1 *>&1 | Tee-Object -FilePath "$env:RES\push.log" -Append; exit 0
      - name: Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: push-${{ matrix.version }}-${{ github.run_id }}
          path: spike-results/push-design/${{ github.run_id }}-${{ matrix.version }}/

  collect:
    needs: [build, tally]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: push-*-${{ github.run_id }}
          path: got
      - name: Commit results back to tally-versions
        run: |
          for d in got/push-*-${{ github.run_id }}; do
            v=$(basename "$d"); v=${v#push-}; v=${v%-${{ github.run_id }}}
            mkdir -p "spike-results/push-design/${{ github.run_id }}-$v"; cp -r "$d"/. "spike-results/push-design/${{ github.run_id }}-$v/"
            if [ -d "$d/push" ]; then
              td="bridge-go/testdata/push-design/$v"; rm -rf "$td"; mkdir -p "$td"
              [ -d "$d/push/captures" ] && cp -r "$d/push/captures"/. "$td/"
              for f in a.csv b.csv sizes.json summary.txt; do [ -f "$d/push/$f" ] && cp "$d/push/$f" "$td/"; done
              echo "run ${{ github.run_id }}, TallyPrime $v, bridge ${{ needs.build.outputs.sha }} (tax-accuracy, 2.3.0 setup), $(date -u +%FT%TZ)" > "$td/SOURCE.txt"
            fi
          done
          git config user.name "push-design"; git config user.email "tally-versions@users.noreply.github.com"
          git add spike-results/push-design; [ -d bridge-go/testdata/push-design ] && git add bridge-go/testdata/push-design
          git commit -q -m "push design [skip ci]: results ${{ github.run_id }} (bridge ${{ needs.build.outputs.sha }})" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01LprHoXx2ACgDW2AjxNH8wN" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase origin tally-versions && git push -q origin HEAD:refs/heads/tally-versions && break; sleep 10; done
