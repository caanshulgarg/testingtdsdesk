# FinCom on every TallyPrime release a customer may have (branch tally-versions only): TallyPrime 3.0, 4.1, 5.1, 6.2 and
# 7.1, each from Tally's own download centre (tallymirror.tallysolutions.com/download_centre/<release folder>/TP/Full/setup.exe,
# the folder as Tally's own download page lists it; never another mirror), installed in Educational mode on a hosted Windows runner and driven by keys as tally-real.yml does.
# The bridge is built from bridge_ref (default tax-accuracy: the published 2.3.0; its committed setup is installed).
#   quick: install, open the company, the port and the company list (flow.ps1, then flowv.ps1 c1-c2)
#   full:  also a posting from the bridge, create / alter / cancel / delete by keys with the add-on, Alt+2, the entry
#          request for one entry, the Tally version string the bridge reads (flowv.ps1 c3-c7)
# A push to tally-versions runs the mode in .github/tally-spike/versions-mode.txt. Results are committed back to
# tally-versions under spike-results/versions/<run>-<release>/ (full: captures also under bridge-go/testdata/real-tally-<release>/).
# A check the harness could not do (a timeout, no window, keys that made no entry) is HARNESS, never PASS.
name: Tally versions
on:
  push:
    branches: [tally-versions]
    paths: ['.github/workflows/tally-versions.yml', '.github/tally-spike/**', '!.github/tally-spike/push/**']
  workflow_dispatch:
    inputs:
      bridge_ref:
        description: 'Branch, tag or commit of the bridge (bridge-go/); tax-accuracy is the published 2.3.0'
        default: tax-accuracy
      mode:
        description: 'quick (install and port), full (every check) or share (next-push: the full line against the stored entry, per kind typed on the screen; no bridge)'
        default: quick
permissions:
  contents: write
concurrency:
  group: tally-versions-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - id: mode
        run: |
          m="${{ inputs.mode }}"; [ -n "$m" ] || m=$(head -1 harness/.github/tally-spike/versions-mode.txt 2>/dev/null | tr -d '[:space:]')
          case "$m" in full|share) ;; *) m=quick ;; esac
          echo "mode=$m" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.bridge_ref || 'tax-accuracy' }}
      - id: sha
        run: |
          echo "sha=$(git rev-parse HEAD)" | tee -a "$GITHUB_OUTPUT"
          git log -1 --format='bridge source: %H %s' | tee bridge-source.txt
      - name: Committed setup at the ref
        id: committed
        run: |
          f=$(ls assets-test/bridge-go/FinComBridge-Setup-*.exe 2>/dev/null | head -1 || true)
          if [ -z "$f" ]; then echo "no committed setup at the ref: building from source"; echo "use=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ -f "$f.sha256" ] || { echo "::error::$f has no $f.sha256 next to it"; exit 1; }
          want=$(awk '{print tolower($1); exit}' "$f.sha256"); got=$(sha256sum "$f" | awk '{print $1}')
          echo "committed setup $f: SHA-256 $got (expected $want)"
          [ "$want" = "$got" ] || { echo "::error::committed setup SHA-256 mismatch: $got, expected $want"; exit 1; }
          mkdir -p bridge-go/dist && cp "$f" bridge-go/dist/ && cp bridge-go/addon/FinComRecorder.tdl bridge-source.txt bridge-go/dist/
          echo "setup origin: COMMITTED $f SHA-256 $got" | tee bridge-go/dist/setup-origin.txt
          echo "use=yes" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        if: steps.committed.outputs.use != 'yes'
        with:
          go-version-file: bridge-go/go.mod
          cache-dependency-path: bridge-go/go.sum
      - name: NSIS (makensis)
        if: steps.committed.outputs.use != 'yes'
        run: sudo apt-get update -q && sudo apt-get install -y -q nsis
      - name: Program and setup (built only to be tested here)
        if: steps.committed.outputs.use != 'yes'
        working-directory: bridge-go
        run: |
          FORCE_REBUILD=1 ./build.sh
          cp addon/FinComRecorder.tdl dist/
          cp ../bridge-source.txt dist/
          f=$(ls dist/FinComBridge-Setup-*.exe | head -1)
          echo "setup origin: BUILT from source $f SHA-256 $(sha256sum "$f" | awk '{print $1}')" | tee dist/setup-origin.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-dist
          path: bridge-go/dist/
          if-no-files-found: error

  tally:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        version: ['3.0', '4.1', '5.1', '6.2', '7.1']
    runs-on: windows-latest
    timeout-minutes: ${{ needs.build.outputs.mode == 'share' && 130 || 75 }}
    env:
      TALLY_REL: ${{ matrix.version }}
      VMODE: ${{ needs.build.outputs.mode }}
      RES: ${{ github.workspace }}\spike-results\versions\${{ github.run_id }}-${{ matrix.version }}
      SHOTS: ${{ github.workspace }}\spike-results\versions\${{ github.run_id }}-${{ matrix.version }}
      LOG: ${{ github.workspace }}\spike-results\versions\${{ github.run_id }}-${{ matrix.version }}\log.txt
      BRIDGE_SHA: ${{ needs.build.outputs.sha }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: bridge-dist
          path: bridge-dist
      - name: Desktop check
        run: |
          New-Item -ItemType Directory -Force $env:RES | Out-Null
          & { "== TallyPrime $env:TALLY_REL, mode $env:VMODE"; whoami; "session=$((Get-Process -Id $PID).SessionId)"
              Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version | Out-String } *>&1 | Tee-Object -FilePath $env:LOG -Append
          exit 0
      - name: 1 Installer from Tally's download centre
        id: dl
        timeout-minutes: 20
        run: |
          & .github/tally-spike/resolvev.ps1 *>&1 | Tee-Object -FilePath $env:LOG -Append; exit $LASTEXITCODE
      - name: 2 Install
        id: inst
        timeout-minutes: 15
        run: |
          & .github/tally-spike/installv.ps1 *>&1 | Tee-Object -FilePath $env:LOG -Append; exit $LASTEXITCODE
      - name: 3 Start Tally, company (flow.ps1)
        timeout-minutes: 15
        continue-on-error: true
        run: |
          & .github/tally-spike/flow.ps1 *>&1 | Tee-Object -FilePath $env:LOG -Append; exit 0
      - name: 4 Checks (flowv.ps1)
        id: checks
        timeout-minutes: ${{ needs.build.outputs.mode == 'share' && 95 || 40 }}
        env:
          BRIDGE_DIST: ${{ github.workspace }}\bridge-dist
        run: |
          & .github/tally-spike/flowv.ps1 *>&1 | Tee-Object -FilePath "$env:RES\versions.log" -Append; exit 0
      - name: Results (a check with no line is HARNESS; installer not downloadable is NOT REACHABLE)
        if: always()
        run: |
          $dir = Join-Path $env:RES 'versions'; New-Item -ItemType Directory -Force $dir | Out-Null
          $r = Join-Path $dir 'results.txt'; if (-not (Test-Path $r)) { Set-Content $r "INFO TallyPrime $env:TALLY_REL, mode $env:VMODE" }
          $want = @('c1 install and open the company', 'c2 port and company list')
          if ($env:VMODE -eq 'full') { $want += @('c3 posting from the bridge', 'c4a create by keys', 'c4b alter by keys', 'c6 entry request', 'c5 Alt+2 duplicate', 'c4c cancel by keys', 'c4d delete by keys', 'c7 version string the bridge reads') }
          $have = Get-Content $r
          foreach ($c in $want) {
            if (-not ($have | Where-Object { $_ -match "^(PASS|FAIL|HARNESS|NOT REACHABLE) $([regex]::Escape($c)):" })) {
              $why = if ('${{ steps.dl.outcome }}' -eq 'failure') { 'NOT REACHABLE', "the installer of TallyPrime $env:TALLY_REL could not be downloaded from Tally's download centre" }
                     elseif ('${{ steps.inst.outcome }}' -eq 'failure') { 'HARNESS', 'the setup did not leave a tally.exe (install step)' }
                     else { 'HARNESS', "no result: the harness stopped or timed out (checks step: ${{ steps.checks.outcome }})" }
              Add-Content $r ("{0} {1}: {2}" -f $why[0], $c, $why[1])
            }
          }
          if (Test-Path "$env:RES\installer.txt") { Get-Content "$env:RES\installer.txt" | ForEach-Object { Add-Content $r "INFO installer: $_" } }
          Get-Content $r | ForEach-Object { if ($_ -like 'FAIL*') { Write-Host "::error::$_" } elseif ($_ -like 'HARNESS*' -or $_ -like 'NOT REACHABLE*') { Write-Host "::warning::$_" } elseif ($_ -like 'PASS*') { Write-Host "::notice::$_" } else { Write-Host $_ } }
      - name: Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tally-${{ matrix.version }}-${{ github.run_id }}
          path: spike-results/versions/${{ github.run_id }}-${{ matrix.version }}/

  # one commit for all five releases (five jobs pushing at once lost four of them in run 37417702347)
  collect:
    needs: [build, tally]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: tally-*-${{ github.run_id }}
          path: got
      - name: Commit results back to tally-versions
        run: |
          for d in got/tally-*-${{ github.run_id }}; do
            v=$(basename "$d"); v=${v#tally-}; v=${v%-${{ github.run_id }}}
            mkdir -p "spike-results/versions/${{ github.run_id }}-$v"; cp -r "$d"/. "spike-results/versions/${{ github.run_id }}-$v/"
            if [ "${{ needs.build.outputs.mode }}" = full ] && [ -d "$d/versions/captures" ]; then
              td="bridge-go/testdata/real-tally-$v"; mkdir -p "$td"; cp -r "$d/versions/captures"/. "$td/"
              cp "$d/versions/results.txt" "$td/results.txt"
              echo "run ${{ github.run_id }}, TallyPrime $v, bridge ${{ needs.build.outputs.sha }}, $(date -u +%FT%TZ)" > "$td/SOURCE.txt"
            fi
          done
          git config user.name "tally-versions"; git config user.email "tally-versions@users.noreply.github.com"
          git add spike-results/versions; [ -d bridge-go/testdata ] && git add bridge-go/testdata
          git commit -q -m "tally versions [skip ci]: results ${{ github.run_id }} ${{ needs.build.outputs.mode }} (bridge ${{ needs.build.outputs.sha }})" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01LprHoXx2ACgDW2AjxNH8wN" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase origin tally-versions && git push -q origin HEAD:refs/heads/tally-versions && break; sleep 10; done
