  tally:
    needs: build
    name: tally ${{ matrix.version }} ${{ matrix.mode }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    runs-on: windows-latest
    timeout-minutes: ${{ matrix.tmo }}
    env:
      TALLY_REL: ${{ matrix.version }}
      VMODE: ${{ matrix.mode }}
      MH_TYPES: ${{ inputs.mhook_types }}
      UPG_FROM: ${{ inputs.upg_from || '2.3.3' }}
      RES: ${{ github.workspace }}\spike-results\versions\${{ github.run_id }}-${{ matrix.version }}-${{ matrix.mode }}
      SHOTS: ${{ github.workspace }}\spike-results\versions\${{ github.run_id }}-${{ matrix.version }}-${{ matrix.mode }}
      LOG: ${{ github.workspace }}\spike-results\versions\${{ github.run_id }}-${{ matrix.version }}-${{ matrix.mode }}\log.txt
      BRIDGE_SHA: ${{ needs.build.outputs.sha }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        if: matrix.mode != 'mhook' && matrix.mode != 'ledlist' && matrix.mode != 'payroll' && matrix.mode != 'paym' && matrix.mode != 'dbm' && matrix.mode != 'dbres' && matrix.mode != 'dbbig' && matrix.mode != 'g245' && matrix.mode != 'proof72'
        with:
          fetch-depth: 0
      # mhook / ledlist need only the harness and the add-on folder: the whole history took 47-60 min on 08-Oct-2026
      - uses: actions/checkout@v4
        if: matrix.mode == 'mhook' || matrix.mode == 'ledlist' || matrix.mode == 'payroll' || matrix.mode == 'paym' || matrix.mode == 'dbm' || matrix.mode == 'dbres' || matrix.mode == 'dbbig' || matrix.mode == 'g245' || matrix.mode == 'proof72'
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github
            bridge-go/addon
      - uses: actions/download-artifact@v4
        with:
          name: bridge-dist
          path: bridge-dist
      - name: Desktop check
        run: |
          New-Item -ItemType Directory -Force $env:RES | Out-Null
          & { "== TallyPrime $env:TALLY_REL, mode $env:VMODE"; whoami; "session=$((Get-Process -Id $PID).SessionId)"
              Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version | Out-String } *>&1 | Tee-Object -FilePath $env:LOG -Append
          exit 0
      - name: 1 Installer from Tally's download centre
        id: dl
        timeout-minutes: 20
        run: |
          & .github/tally-spike/resolvev.ps1 *>&1 | Tee-Object -FilePath $env:LOG -Append; exit $LASTEXITCODE
      - name: 2 Install
        id: inst
        timeout-minutes: 15
        run: |
          & .github/tally-spike/installv.ps1 *>&1 | Tee-Object -FilePath $env:LOG -Append; exit $LASTEXITCODE
      - name: 3 Start Tally, company (flow.ps1)
        timeout-minutes: 15
        continue-on-error: true
        run: |
          & .github/tally-spike/flow.ps1 *>&1 | Tee-Object -FilePath $env:LOG -Append; exit 0
      - name: 4 Checks (flowv.ps1)
        id: checks
        timeout-minutes: ${{ matrix.ctmo }}
        env:
          BRIDGE_DIST: ${{ github.workspace }}\bridge-dist
        run: |
          & .github/tally-spike/flowv.ps1 *>&1 | Tee-Object -FilePath "$env:RES\versions.log" -Append; exit 0
      - name: Results (a check with no line is HARNESS; installer not downloadable is NOT REACHABLE)
        if: always()
        run: |
          $dir = Join-Path $env:RES 'versions'; New-Item -ItemType Directory -Force $dir | Out-Null
          $r = Join-Path $dir 'results.txt'; if (-not (Test-Path $r)) { Set-Content $r "INFO TallyPrime $env:TALLY_REL, mode $env:VMODE" }
          $want = @('c1 install and open the company', 'c2 port and company list')
          if ($env:VMODE -eq 'renum') { $want += @('r1 insert with renumbering on', 'r2 delete with renumbering on') }
          if ($env:VMODE -eq 'dpath') { $want += @('d1 the data folder formula in the add-on''s events', 'd2 the add-on with the field writes the folder') }
          if ($env:VMODE -eq 'bankb') { $want += @('b1 bank dates set in Bank Reconciliation reach FinCom') }
          if ($env:VMODE -eq 's235') { $want += @('s1 stop: three lines held, nothing asked', 's2 lift: bodies and the delete with its GUID', 's3 restart: the held delete keeps its GUID', 's4 a real failure still counts', 's5 Tally not open: one notification a day') }
          if ($env:VMODE -eq 'tds240') { $want += @('t1 TDS typed on the screen: the TDS details carried to FinCom', 't2 TDS rate: worked out only where Tally stores 0, never on an exempt line') }
          if ($env:VMODE -eq 'selfck') { $want += @('n1 nightly check: Tally''s changes compared, the missing fetched', 'n2 nightly check: the words recorded', 'n3 nightly check: once a night') }
          if ($env:VMODE -eq 'upg' -and $env:UPG_FROM -eq '2.4.0') { $want += @('u1 2.4.1 installed over 2.4.0: the version and the settings carried', 'u2 the recorder state carried: nothing sent twice, nothing lost', 'u3 held lines from 2.4.0: each asked once in all and ended', 'u4 a new save after the upgrade arrives with its body') }
          elseif ($env:VMODE -eq 'upg' -and $env:UPG_FROM -eq '2.4.6') { $want += @('u1 2.4.7 installed over 2.4.6: the version and the settings carried', 'u2 the recorder state carried: nothing sent twice, nothing lost', 'u3 held lines from 2.4.6: each asked once in all and ended', 'u4 a new save after the upgrade arrives with its body') }
          elseif ($env:VMODE -eq 'upg' -and $env:UPG_FROM -eq '2.4.5') { $want += @('u1 2.4.6 installed over 2.4.5: the version and the settings carried', 'u2 the recorder state carried: nothing sent twice, nothing lost', 'u3 held lines from 2.4.5: each asked once in all and ended', 'u4 a new save after the upgrade arrives with its body') }
          elseif ($env:VMODE -eq 'upg' -and $env:UPG_FROM -eq '2.4.4') { $want += @('u1 2.4.5 installed over 2.4.4: the version and the settings carried', 'u2 the recorder state carried: nothing sent twice, nothing lost', 'u3 held lines from 2.4.4: each asked once in all and ended', 'u4 a new save after the upgrade arrives with its body') }
          elseif ($env:VMODE -eq 'upg' -and $env:UPG_FROM -eq '2.4.3') { $want += @('u1 2.4.4 installed over 2.4.3: the version and the settings carried', 'u2 the recorder state carried: nothing sent twice, nothing lost', 'u3 held lines from 2.4.3: each asked once in all and ended', 'u4 a new save after the upgrade arrives with its body') }
          elseif ($env:VMODE -eq 'upg' -and $env:UPG_FROM -eq '2.4.2') { $want += @('u1 2.4.3 installed over 2.4.2: the version and the settings carried', 'u2 the recorder state carried: nothing sent twice, nothing lost', 'u3 held lines from 2.4.2: each asked once in all and ended', 'u4 a new save after the upgrade arrives with its body') }
          elseif ($env:VMODE -eq 'upg' -and $env:UPG_FROM -eq '2.4.1') { $want += @('u1 2.4.2 installed over 2.4.1: the version and the settings carried', 'u2 the recorder state carried: nothing sent twice, nothing lost', 'u3 held lines from 2.4.1: each asked once in all and ended', 'u4 a new save after the upgrade arrives with its body') }
          elseif ($env:VMODE -eq 'upg') { $want += @('u1 2.4.0 installed over 2.3.3: the version and the settings carried', 'u2 the recorder state carried: nothing sent twice, nothing lost', 'u3 held lines from 2.3.3: each asked once and ended', 'u4 a new save after the upgrade arrives with its body') }
          if ($env:VMODE -eq 'tdsch') { $want += @('h1 TDS masters made (natures with threshold, duty ledgers with nature, parties with deductee type, PAN, lower deduction)', 'h2 TDS deductions made (keys and XML)', 'h3 TDS payment by Stat Payment (keys) and by XML', 'h4 challan details on the payment (Challan Reconciliation keys, else XML)', 'h5 raw answers kept (FinComVoucherObject, FinComLedgers, Tally full exports)') }
          if ($env:VMODE -eq 'payroll') { $want += @('y1 payroll and statutory payroll on (company switches read back)', 'y2 payroll masters by XML (attendance types, groups, 3 employees with details, pay heads)', 'y3 payroll entries by XML (attendance, payroll x2 months, employer PF, salary payment, TDS on salary)', 'y4 raw answers kept (object exports, FinComVoucherObject, full entries, List of Accounts, FinComLedgers)', 'y5 500 employees: candidate requests timed (one at a time, 5 each)') }
          if ($env:VMODE -eq 'paym') { $want += @('p1 payroll made by XML (pay heads, 2,000 employees, 20 other cost centres, a payroll of 500)', 'p2 the ledger requests give the pay-head fields', 'p3 FinComEmployees, chunked, finds every cost centre, the payroll ones marked', 'p4 the 500-employee payroll entry (FinComVoucherObject) under 3 s, Tally responding', 'p5 times at 20,000 ledgers and 2,000 employees (every 2.4.4 master request under 2 s, Tally responding)') }
          if ($env:VMODE -eq 'dbm') { $want += @('k1 test data made in Tally (ledgers, entries on the test days as Tally holds them)', 'k2 the Day Book for one day: the date forms that give exactly that day', 'k3 the collection date forms (FinComDatesProbe) for one day', 'k4 a day split by voucher type: exact per type, each under 2 s', 'k5 the ledger count: candidate forms exact at ~1,240 and ~5,000 ledgers, under 2 s', 'k6 one request at a time, 2 s hard stop: overruns kept, Tally responding after each') }
          if ($env:VMODE -eq 'dbbig') { $want += @('i1 tally.ini as TallyPrime installs it (captured before the harness wrote its own)', 'i2 the add-on added to tally.ini (add only, backup, other TDL kept): loaded at Tally start, the other TDL too', 'i3 tally.ini with User TDL = No: what Tally does with an added User TDL = Yes', 'i4 idempotent and untouched by Tally: a second run changes nothing, Tally keeps the lines and their order', 'b1 big company made (about 30,000 entries, 20,000 ledgers)', 'b2 one day of the Day Book on the big company (D1, D5), and whether D5 moves Tally''s current date', 'b3 one day by the collection date forms on the big company', 'b4 a day split by voucher type on the big company', 'b5 the voucher count of a period (month, quarter, half-year, year)', 'b6 the ledger count at 20,000 and 50,000 ledgers', 'b7 one request at a time, 2 s stop, Tally''s window blocked time kept') }
          if ($env:VMODE -eq 'g245') { $want += @('g1 the installer added the add-on to tally.ini; Tally loads it and the client''s other TDL at start', 'g2 the year counted day by day, every day exactly Tally''s count', 'g3 the chosen part fetched: FinCom holds every entry Tally lists, only what it lacked asked', 'g4 no request over 2 s, one at a time, Tally''s window never blocked 2 s, Tally responding', 'g5 postings first during the fetch', 'g6 the exact ledger count and its progress', 'g7 User TDL = No left untouched and reported', 'g8 job files read while written: nothing lost, never missing', 'g9 a day''s list held over 2 s stops reading older entries of the company (freeze safety)', 'g10 the night pace: day after day, more than 3 days an answer, entries a minute measured', 'g11 the payroll month in the period: employees first, payroll entries within 3 s, pay heads per employee, no bank detail') }
          if ($env:VMODE -eq 'proof72') { $want += @('p1 bridge 2.4.7 installed and connected: finds Tally, the company list, the ledger list', 'p2 a save on the screen reaches FinCom through the add-on', 'p3 a Payment posted by the bridge: CREATED and LASTVCHID', 'p4 tally.ini keys TallyPrime writes from its own port screen (port, acts as, ODBC)', 'p5 a port written into tally.ini with Tally closed is used at the next start', 'p6 two Tallys on one computer (the same install twice; a copy of the install on another port)', 'p7 company GUID after a rename and after a copy of the data folder', 'p8 the FinCom ID on a voucher after an edit on the screen (narration tag, REMOTEID)', 'p9 lookups by FinCom ID, GUID and MasterID: times (2 s stop) on the small and the ~30,000-entry company', 'p10 a batch of 3 with one missing ledger: Tally''s exact reply', 'p11 Tally''s window and requests during the run (window probe, the bridge''s requests at the proxy)', 'p12 Tally on port 4125 (below 9000): does bridge 2.4.7 connect (auto / config), what Test connection and the diagnosis say') }
          if ($env:VMODE -eq 'dbres') { $want += @('r1 missing days with Tally closed and reopened: resumed, every day fetched or marked upload, nothing twice', 'r2 missing days with a modal screen left open: no request held over 2 s unseen, finished after it closed', 'r3 missing days with Tally not answering: stopped at 2 s, waited, resumed', 'r4 the ledger read through close / modal / not answering: every ledger once, progress never back, count right', 'r5 Tally responsive at the end of every scenario') }
          if ($env:VMODE -eq 'tdsm') { $want += @('m1 TDS masters made (natures with rates and threshold, duty ledger with nature, certificate, special rate)', 'm2 the ledger requests give the nature, the special rate and the certificate', 'm3 FinComTdsNatures, chunked, finds every nature with its section, rates and threshold', 'm4 the challan fields in FinComVoucherObject''s answer', 'm5 times on ZZ BIG TEST''s masters and at 20,000 ledgers (every 2.4.3 request under 2 s, Tally responding)') }
          if ($env:VMODE -eq 'gsttype') { $want += @('x1 the GST entries made in Tally', 'x2 the entry request answered for every entry (raw kept, timed)', 'x3 the blocked credit as Tally keeps it') }
          if ($env:VMODE -eq 'payg') { $want += @('w1 the payroll company made in Tally (masters and the 36 entries)', 'w2 FinComEmployees: only payroll rows reach FinCom, nothing personal', 'w3 the ledger list carries the pay-head fields', 'w4 every entry reaches FinCom; a salary payment keeps the employee and amount, never the bank details', 'w5 the payroll entry within 3 s, every other request within 2 s, Tally responding') }
          if ($env:VMODE -eq 'tdsgst') { $want += @('g1 masters and entries made in Tally', 'g2 the bridge sent every entry (phase 1)', 'g3 the amendments made in Tally and sent (phase 2)', 'g4 the Day Book and masters exported') }
          if ($env:VMODE -eq 'dsrc') { $want += @('d1 a save in folder 1 (the bridge''s own Tally): applied, its line with dp= of folder 1', 'd2 a save in folder 2 (one Tally, one folder at a time): never fetched, never applied; other_source with folder 2''s data id, no body', 'd2b a save in folder 2 with two Tallys at once: never fetched, never applied; other_source with folder 2''s data id, no body', 'd3 FinCom chooses folder 2: after a fresh starting point folder 2''s new saves applied, folder 1''s held', 'd4 the fallback by number: asked once, answered within 2 s, taken only when exactly one voucher matches') }
          if ($env:VMODE -eq 'full') { $want += @('c3 posting from the bridge', 'c4a create by keys', 'c4b alter by keys', 'c6 entry request', 'c5 Alt+2 duplicate', 'c4c cancel by keys', 'c4d delete by keys', 'c7 version string the bridge reads') }
          $have = Get-Content $r
          foreach ($c in $want) {
            if (-not ($have | Where-Object { $_ -match "^(PASS|FAIL|HARNESS|NOT REACHABLE) $([regex]::Escape($c)):" })) {
              $why = if ('${{ steps.dl.outcome }}' -eq 'failure') { 'NOT REACHABLE', "the installer of TallyPrime $env:TALLY_REL could not be downloaded from Tally's download centre" }
                     elseif ('${{ steps.inst.outcome }}' -eq 'failure') { 'HARNESS', 'the setup did not leave a tally.exe (install step)' }
                     else { 'HARNESS', "no result: the harness stopped or timed out (checks step: ${{ steps.checks.outcome }})" }
              Add-Content $r ("{0} {1}: {2}" -f $why[0], $c, $why[1])
            }
          }
          if (Test-Path "$env:RES\installer.txt") { Get-Content "$env:RES\installer.txt" | ForEach-Object { Add-Content $r "INFO installer: $_" } }
          Get-Content $r | ForEach-Object { if ($_ -like 'FAIL*') { Write-Host "::error::$_" } elseif ($_ -like 'HARNESS*' -or $_ -like 'NOT REACHABLE*') { Write-Host "::warning::$_" } elseif ($_ -like 'PASS*') { Write-Host "::notice::$_" } else { Write-Host $_ } }
      - name: Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tally-${{ matrix.version }}-${{ matrix.mode }}-${{ github.run_id }}
          path: spike-results/versions/${{ github.run_id }}-${{ matrix.version }}-${{ matrix.mode }}/

  # one commit for all five releases (five jobs pushing at once lost four of them in run 37417702347)
  collect:
    needs: [build, tally]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # .github only (the whole tree no longer fits the runner's disk); the results are added with git add --sparse
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
      - uses: actions/download-artifact@v4
        with:
          pattern: tally-*-${{ github.run_id }}
          path: got
      - name: Commit results back to tally-versions
        run: |
          for d in got/tally-*-${{ github.run_id }}; do
            v=$(basename "$d"); v=${v#tally-}; v=${v%-${{ github.run_id }}}; md=${v#*-}; v=${v%%-*}
            mkdir -p "spike-results/versions/${{ github.run_id }}-$v-$md"; cp -r "$d"/. "spike-results/versions/${{ github.run_id }}-$v-$md/"
            if [ "$md" = full ] && [ -d "$d/versions/captures" ]; then
              td="bridge-go/testdata/real-tally-$v"; mkdir -p "$td"; cp -r "$d/versions/captures"/. "$td/"
              cp "$d/versions/results.txt" "$td/results.txt"
              echo "run ${{ github.run_id }}, TallyPrime $v, bridge ${{ needs.build.outputs.sha }}, $(date -u +%FT%TZ)" > "$td/SOURCE.txt"
            fi
          done
          # every check line of every job, one file (the gate's summary): spike-results/versions/<run>-summary.txt
          for r in spike-results/versions/${{ github.run_id }}-*/versions/results.txt; do
            j=$(echo "$r" | sed -E 's#.*/[0-9]+-([^/]+)/versions/results.txt#\1#'); grep -E '^(PASS|FAIL|HARNESS|NOT REACHABLE|MEASURE)' "$r" | sed "s#^#[$j] #"
          done > "spike-results/versions/${{ github.run_id }}-summary.txt" || true
          echo "PASS $(grep -c '\] PASS' spike-results/versions/${{ github.run_id }}-summary.txt) FAIL $(grep -c '\] FAIL' spike-results/versions/${{ github.run_id }}-summary.txt) HARNESS $(grep -c '\] HARNESS' spike-results/versions/${{ github.run_id }}-summary.txt)"
          git config user.name "tally-versions"; git config user.email "tally-versions@users.noreply.github.com"
          git add --sparse spike-results/versions; [ -d bridge-go/testdata ] && git add --sparse bridge-go/testdata
          git commit -q -m "tally versions [skip ci]: results ${{ github.run_id }} ${{ inputs.mode || needs.build.outputs.mode }} (bridge ${{ needs.build.outputs.sha }})" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01LprHoXx2ACgDW2AjxNH8wN" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase origin tally-versions && git push -q origin HEAD:refs/heads/tally-versions && break; sleep 10; done
