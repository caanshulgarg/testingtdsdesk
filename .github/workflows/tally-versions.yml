# FinCom on every TallyPrime release a customer may have (branch tally-versions only): TallyPrime 3.0, 4.1, 5.1, 6.2, 7.1
# and 7.2 (released 12-Oct-2026; added 26-Oct-2026), each from Tally's own download centre (tallymirror.tallysolutions.com/download_centre/<release folder>/TP/Full/setup.exe,
# the folder as Tally's own download page lists it; never another mirror), installed in Educational mode on a hosted Windows runner and driven by keys as tally-real.yml does.
# The bridge is built from bridge_ref (default tax-accuracy: the published 2.3.0; its committed setup is installed).
#   quick: install, open the company, the port and the company list (flow.ps1, then flowv.ps1 c1-c2)
#   full:  also a posting from the bridge, create / alter / cancel / delete by keys with the add-on, Alt+2, the entry
#          request for one entry, the Tally version string the bridge reads (flowv.ps1 c3-c7)
# 2.4.0's combined gate: mode gate240 (or a comma list of modes) runs one job per mode and release; the setup committed at
# bridge_ref for its own BridgeVersion is installed (from_source=no), checked against its .sha256; each job's results under
# spike-results/versions/<run>-<release>-<mode>/, all of them in spike-results/versions/<run>-summary.txt.
# A push to tally-versions runs the mode in .github/tally-spike/versions-mode.txt. Results are committed back to
# tally-versions under spike-results/versions/<run>-<release>/ (full: captures also under bridge-go/testdata/real-tally-<release>/).
# A check the harness could not do (a timeout, no window, keys that made no entry) is HARNESS, never PASS.
name: Tally versions
on:
  push:
    branches: [tally-versions]
    paths: ['.github/workflows/tally-versions.yml', '.github/tally-spike/**', '!.github/tally-spike/push/**']
  workflow_dispatch:
    inputs:
      bridge_ref:
        description: 'Branch, tag or commit of the bridge (bridge-go/); tax-accuracy is the published 2.3.0'
        default: tax-accuracy
      mode:
        description: 'quick (install and port), full (every check) share (next-push: the full line against the stored entry, per kind typed on the screen; no bridge) or big (the add-on''s own share of a save on a 100,000-entry company) or hang (the hang of run 37729166801 isolated, each probe in a fresh Tally) or hang2 (the share company, then each entry asked in a fresh Tally) or hang3 (the share session, the published requests after every step) or hang4 (the harness''s malformed filter against the correct one) or bank (the bank-date probe: does any event an add-on can hook fire when a bank date is set; bankv.ps1, a probe variant of the add-on in the harness only) or bankb (next-bankdate: bank dates set in Bank Reconciliation with the bridge built from source and stubr.py as the cloud; FinCom''s copy ends with Tally''s bank dates; bankv.ps1; 3.0 and 7.1 only) or renum (next-renumber: an insert and a delete with renumbering on, the bridge built from source with stubr.py as the cloud; FinCom ends with Tally''s numbers; 3.0 and 7.1 only) or ledlist (next-masterhook: the bridge''s FinComLedgers chunks and FinComLedgerChanges, request XML from the ref''s source, on about 2,000 / 5,000 / 20,000 ledgers; ledv.ps1; 3.0 and 7.1) or mhook (next-masterhook: Stock Item, Godown and Pay Head created / altered / deleted on the screen with the ref''s add-on and with no TDL, Tally''s stored master against what was typed; mhookv.ps1, ocrw.ps1) or dpath (2.4.1: the formula for the data folder the company was opened from, inside the add-on''s Form Accept / delete / cancel events, two data folders, and its save time; dpathv.ps1) or tdsgst (round 43, TallyPrime 7.1 only, test data: a throwaway company with GST and TDS, 39 entries by XML, the published bridge 2.4.1 reading them as in production with recorderSource both, the amendments after filing; Day Book, masters and every request the bridge sent kept for tests/run_e2e_tdsgst.py; tdsgstv.ps1, stubg.py) or gsttype (2.4.2: what Tally stores for an entry''s GST type: the round-43 GST entries, the blocked credit set three ways, an item invoice; each asked with the ref''s FinComVoucherObject, raw answers and times kept; gsttypev.ps1, no bridge) or tdsm (2.4.3, measure only, test data, all five releases: the ref''s ledger requests with the TDS settings and FinComTdsNatures, answers and times on ZZ BIG TEST''s masters and 20,000 ledgers; tdsmv.ps1, no bridge) or tdsch (measure only, test data, 7.1 by default: TDS challan details and TDS master settings, where Tally keeps them, as the ref''s FinComVoucherObject and FinComLedgers answer them and in Tally''s full export; tdschv.ps1, no bridge) or paym (2.4.4, measure only, test data, all five releases: the ref''s FinComEmployees on 2,000 employees, the ledger requests with the pay-head fields at 20,000 ledgers, FinComVoucherObject on a payroll of 500 under 3 s; paymv.ps1, no bridge) or payroll (measure only, test data, 7.1 by default: payroll and statutory payroll on, employee groups, employees with details, pay heads, attendance types, payroll entries by XML; every tag that carries data, and the candidate employee / pay-head / attendance-type requests timed on 500 employees; payrollv.ps1, no bridge) or payg (2.4.4''s gate: the payroll test company (payg/, from tests/fixtures/payroll-e2e) in Tally by XML, the gate''s setup reading it with stubg.py as the cloud: only payroll employees sent, nothing personal, the pay-head fields, each salary payment''s employee and amount without the bank details, the payroll entry under 3 s; all five releases; paygv.ps1) or dbm (2.4.5, measure only, test data, all five releases: ZZ BIG TEST re-dated onto Educational days with 50 / 300 / 800 entries, ~1,240 and ~5,000 ledgers; the Day Book for ONE day in each date form, the same split by voucher type, and each candidate ledger-count form, one request at a time with a 2 s hard stop, overruns kept; dbmv.ps1, no bridge) or dbres (2.4.5, test data, all five releases: the missing-day fetch and the ledger read as 2.4.5 is designed to do them, with Tally closed and reopened, a modal screen left open and Tally not answering; Tally responsive at the end; dbresv.ps1, no bridge) or g245 (2.4.5''s gate, test data, all five releases: the committed setup on ZZ BIG TEST, about 30,000 entries: the installer''s tally.ini line, the year counted day by day and Apr-Sep fetched with stub245.py as the cloud, no request over 2 s and no freeze through proxy235.py, postings first, the ledger count, User TDL = No left alone, job files read while written; g245v.ps1) or proof72 (TallyPrime 7.2 proof, test data, 7.1 and 7.2 by default: the published bridge 2.4.7 installed and posting unchanged, the tally.ini keys TallyPrime writes for port / acts as / ODBC, a port written with Tally closed, two Tallys on one computer, the company GUID after a rename and a copy, the FinCom ID after an edit on the screen, lookups by FinCom ID / GUID / MasterID on ~30,000 entries, a batch with one missing ledger, the window probe; p72v.ps1, stubv.py, proxy235.py with P72_DUMP) or s235 (bridge 2.3.5 built from source: FinCom''s read stop from the beat answer with a create / alter / delete on the screen, the lift, a bridge restart, a real failure that counts, the Tally-not-open notification once a day; s235v.ps1, stub235.py, proxy235.py; 3.0 and 7.1 only)'
        default: quick
      # 2.4.0's combined gate (the coordinator, 08-Oct-2026): mode gate240 = every mode below in one run, one job per mode and
      # release (s235, tds240, renum, bankb, selfck, mhook, ledlist, upg), on all five releases unless versions says; a comma
      # list of modes (e.g. s235,upg) runs those. New modes: tds240 (a TDS payment typed on the screen: TDS details carried,
      # an exempt line not given a worked-out rate; parse.js of the ref), selfck (the nightly self-check forced: Tally's
      # list compared, the missing fetched, the words of migration 65's tally_selfcheck_words), upg (2.4.0 installed over a
      # running 2.3.3 with held lines and recorder state: everything carried, held lines asked once)
      mhook_types:
        description: 'mhook: the master types to run (comma list of godown, stockitem, payhead; empty: all three). The gate runs only the types the proof helper reports proven'
        default: ''
      from_source:
        description: 'yes: build the bridge from bridge_ref''s source even when a setup of its version is committed there. no (the gate): install the setup committed at the ref for its BridgeVersion (assets-test/bridge-go/FinComBridge-Setup-<version>.exe, checked against its .sha256); a ref with no setup of its own version is built from source'
        default: 'no'
      versions:
        description: 'Releases to run, comma separated (e.g. 3.0,7.1); empty: the mode''s own list'
        default: ''
      # 2.4.1's gate (09-Oct-2026): mode dsrc (one company in two data folders: dsrcv.ps1, stubds.py) and upg from the
      # published 2.4.0 (upg_from=2.4.0: its committed setup, SHA-256 00ab8042...16dc, and add-on from 3bf7b6d9)
      upg_from:
        description: 'upg: the published release installed first (2.3.3, 2.4.0 for 2.4.1''s gate, 2.4.1 for 2.4.2''s gate, 2.4.2 for 2.4.3''s gate, 2.4.3 for 2.4.4''s gate, 2.4.4 for 2.4.5''s gate, 2.4.5 for 2.4.6''s gate, 2.4.6 for 2.4.7''s gate)'
        default: '2.3.3'
permissions:
  contents: write
concurrency:
  group: tally-versions-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      mode: ${{ steps.mode.outputs.mode }}
      versions: ${{ steps.mode.outputs.versions }}
      matrix: ${{ steps.mode.outputs.matrix }}
    steps:
      # the harness only (.github): the branch's whole tree (spike-results) no longer fits the Linux runner's disk (runs
      # 40354492415 and 40355902391, 26-Oct-2026: "No space left on device" at this checkout)
      - uses: actions/checkout@v4
        with:
          path: harness
          sparse-checkout: |
            .github
      - id: mode
        run: |
          m="${{ inputs.mode }}"; [ -n "$m" ] || m=$(head -1 harness/.github/tally-spike/versions-mode.txt 2>/dev/null | tr -d '[:space:]')
          [ "$m" = gate240 ] && m="s235,tds240,renum,bankb,selfck,mhook,ledlist,upg"
          known="proof72 g245 dbm dbres dbbig payg paym payroll tdsm tdsch gsttype tdsgst full mhook ledlist dpath dsrc share big hang hang2 hang3 hang4 bank bankb renum s235 tds240 selfck upg quick"
          v="${{ inputs.versions }}"; v=$(echo "$v" | tr -d '[:space:]')
          modes=""; for x in $(echo "$m" | tr ',' ' '); do case " $known " in *" $x "*) modes="$modes $x" ;; *) echo "::warning::unknown mode $x: quick"; modes="$modes quick" ;; esac; done
          [ -n "$modes" ] || modes=quick
          first=$(echo $modes | awk '{print $1}'); echo "mode=$first" | tee -a "$GITHUB_OUTPUT"
          inc=""; all=""
          for x in $modes; do
            # a mode's own releases when none are given: ledlist / renum / s235 / bankb were 3.0 and 7.1; the gate gives versions
            if [ -n "$v" ]; then vs="$v"; elif echo "$m" | grep -q ','; then vs="3.0,4.1,5.1,6.2,7.1,7.2"; else case $x in ledlist|renum|s235|bankb) vs="3.0,7.1" ;; tdsgst|tdsch|payroll) vs="7.1" ;; proof72) vs="7.1,7.2" ;; *) vs="3.0,4.1,5.1,6.2,7.1,7.2" ;; esac; fi
            case $x in hang2|mhook) t=220; c=190 ;; paym|dbm|dbres) t=170; c=145 ;; dbbig) t=240; c=215 ;; g245) t=300; c=270 ;; proof72) t=200; c=170 ;; tdsgst|tdsch|payroll|payg) t=150; c=125 ;; ledlist|share|big|hang|hang3|bank|bankb|renum|s235|tds240|selfck|upg|dpath|dsrc|gsttype|tdsm) t=130; c=105 ;; *) t=75; c=40 ;; esac
            # TallyPrime 7.2 (added 26-Oct-2026): asked here first (Linux, the first KB) so a release the download centre does not
            # have never takes a Windows job; resolvev.ps1 asks again on Windows and downloads it
            if echo ",$vs," | grep -q ',7.2,'; then
              u72="https://tallymirror.tallysolutions.com/download_centre/Rel.7.2_gold/TP/Full/setup.exe"
              c72=$(curl -s -o /dev/null -r 0-1023 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)' -w '%{http_code} %{size_download} %header{content-range}' --max-time 60 --max-filesize 5000000 "$u72" || true)
              echo "TallyPrime 7.2 at $u72: $c72"
              case "$c72" in 200*|206*) echo "::notice::TallyPrime 7.2 setup reachable: $c72" ;; *) echo "::error::TallyPrime 7.2 not on Tally's download centre ($u72: $c72): 7.2 dropped from this run"; vs=$(echo ",$vs," | sed 's/,7\.2,/,/g; s/^,//; s/,$//') ;; esac
            fi
            for r in $(echo "$vs" | tr ',' ' '); do inc="$inc{\"version\":\"$r\",\"mode\":\"$x\",\"tmo\":$t,\"ctmo\":$c},"; all="$all\"$r\","; done
          done
          echo "matrix={\"include\":[${inc%,}]}" | tee -a "$GITHUB_OUTPUT"
          echo "versions=[${all%,}]" | tee -a "$GITHUB_OUTPUT"
          echo "modes=$(echo $modes | tr ' ' ',')" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.bridge_ref || 'tax-accuracy' }}
      - id: sha
        run: |
          echo "sha=$(git rev-parse HEAD)" | tee -a "$GITHUB_OUTPUT"
          git log -1 --format='bridge source: %H %s' | tee bridge-source.txt
      - name: Committed setup at the ref
        id: committed
        run: |
          # the setup committed at the ref for ITS OWN version (BridgeVersion in bridge-go/util.go), checked against its
          # .sha256: the exact file that ships. A ref with no setup of its own version (a branch carrying an older release's
          # setup) is built from source; from_source=yes builds from source anyway
          ver=$(grep -oP 'var BridgeVersion = "\K[0-9.]+' bridge-go/util.go || true)
          f=$(ls assets-test/bridge-go/FinComBridge-Setup-$ver.exe 2>/dev/null | head -1 || true)
          echo "the ref's BridgeVersion: $ver; committed setups: $(ls assets-test/bridge-go/FinComBridge-Setup-*.exe 2>/dev/null | tr '\n' ' ')"
          if [ "${{ inputs.from_source }}" = yes ]; then echo "from_source=yes: building from source"; f=""; fi
          if [ -z "$ver" ] || [ -z "$f" ]; then echo "no committed setup of version $ver at the ref (or from_source=yes): building from source"; echo "use=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ -f "$f.sha256" ] || { echo "::error::$f has no $f.sha256 next to it"; exit 1; }
          want=$(awk '{print tolower($1); exit}' "$f.sha256"); got=$(sha256sum "$f" | awk '{print $1}')
          echo "committed setup $f: SHA-256 $got (expected $want)"
          [ "$want" = "$got" ] || { echo "::error::committed setup SHA-256 mismatch: $got, expected $want"; exit 1; }
          mkdir -p bridge-go/dist && cp "$f" bridge-go/dist/ && cp bridge-go/addon/FinComRecorder.tdl bridge-source.txt bridge-go/dist/
          echo "setup origin: COMMITTED $f SHA-256 $got" | tee bridge-go/dist/setup-origin.txt
          echo "use=yes" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version-file: bridge-go/go.mod
          cache-dependency-path: bridge-go/go.sum
      - name: NSIS (makensis)
        if: steps.committed.outputs.use != 'yes'
        run: sudo apt-get update -q && sudo apt-get install -y -q nsis
      - name: Program and setup (built only to be tested here)
        if: steps.committed.outputs.use != 'yes'
        working-directory: bridge-go
        run: |
          FORCE_REBUILD=1 ./build.sh
          cp addon/FinComRecorder.tdl dist/
          cp ../bridge-source.txt dist/
          f=$(ls dist/FinComBridge-Setup-*.exe | head -1)
          echo "setup origin: BUILT from source $f SHA-256 $(sha256sum "$f" | awk '{print $1}')" | tee dist/setup-origin.txt
      # the ref's own ledger requests (ledlist: written by a throwaway go test from the ref's source, never committed) and
      # entry request (tds240 / selfck / upg time and judge with it); a ref without a function leaves that file out
      - name: The bridge's own requests at the ref
        continue-on-error: true
        working-directory: bridge-go
        run: |
          mkdir -p dist/ledreq dist/requests
          one() {
            printf 'package main\n\nimport (\n\t"os"\n\t"testing"\n)\n\nfunc TestFCSpikeReq(t *testing.T) {\n\tif err := os.WriteFile(os.Getenv("FC_REQ_OUT"), []byte(%s), 0o644); err != nil {\n\t\tt.Fatal(err)\n\t}\n}\n' "$2" > zz_fcspike_req_test.go
            if FC_REQ_OUT="$PWD/dist/$1" go test -run '^TestFCSpikeReq$' -count=1 . > "dist/$1.log" 2>&1; then echo "$1: $(head -c 200 dist/$1)"; else echo "$1: not at this ref ($(grep -m1 -E 'undefined|error' dist/$1.log))"; rm -f "dist/$1"; fi
            rm -f zz_fcspike_req_test.go "dist/$1.log"
          }
          one ledreq/ledlist-chunk.xml 'ledgerChunkRequest("@@CO@@", 111111, 222222)'
          one ledreq/ledlist-tail.xml 'ledgerChunkRequest("@@CO@@", 111111, 0)'
          one ledreq/ledgroups.xml 'groupListRequest("@@CO@@")'
          one ledreq/ledchanges.xml 'ledgerChangesRequest("@@CO@@", 111111, 222222)'
          one requests/entry-object.xml 'voucherObjectRequest("FinCom Spike Co", "99999")'
          # 2.4.3 (tdsm): the ledger request with 2.4.2's fields beside it, one ledger by name, the natures of payment
          one ledreq/ledlist-chunk-242.xml 'fcCollection(ledListID, "@@CO@@", "", "Ledger", ledFetch242, masterRange(111111, 222222))'
          one ledreq/ledbyname.xml 'ledgerByNameRequest("@@CO@@", "@@NAME@@")'
          one ledreq/natures-chunk.xml 'natureChunkRequest("@@CO@@", 111111, 222222)'
          one ledreq/natures-tail.xml 'natureChunkRequest("@@CO@@", 111111, 0)'
          # 2.4.4 (paym): FinComEmployees as the bridge reads it, and the ledger chunk with 2.4.3's fields beside it
          one ledreq/employees-chunk.xml 'employeeChunkRequest("@@CO@@", 111111, 222222)'
          one ledreq/employees-tail.xml 'employeeChunkRequest("@@CO@@", 111111, 0)'
          one ledreq/ledlist-chunk-243.xml 'fcCollection(ledListID, "@@CO@@", "", "Ledger", ledFetch243, masterRange(111111, 222222))'
          echo "Written by a go test at $(git rev-parse HEAD) (the gate's ref): ledgerChunkRequest, groupListRequest, ledgerChangesRequest, ledgerByNameRequest, natureChunkRequest, employeeChunkRequest" > dist/ledreq/SOURCE.txt
          # 2.4.5 (dbm / dbres): the Day Book in each of the four date forms, the seven collection date forms (FinComDatesProbe),
          # the heads list, the ledger names and the MasterID-only ledger list (the candidate count form L3), the company check
          mkdir -p dist/dbmreq
          one dbmreq/daybook-plain.xml 'dayBookRequestForm("@@CO@@", formPlain, "20991231", "20991231")'
          one dbmreq/daybook-dmy.xml 'dayBookRequestForm("@@CO@@", formDMY, "20991231", "20991231")'
          one dbmreq/daybook-plaint.xml 'dayBookRequestForm("@@CO@@", formPlainT, "20991231", "20991231")'
          one dbmreq/daybook-dmyt.xml 'dayBookRequestForm("@@CO@@", formDMYT, "20991231", "20991231")'
          for i in 1 2 3 4 5 6 7; do one dbmreq/datesprobe-$i.xml "datesProbeRequest(\"@@CO@@\", collForms[$((i-1))], \"20991231\", \"20991231\")"; done
          one dbmreq/vchheads.xml 'vchHeadsRequest("@@CO@@", "20991231", "20991231")'
          one dbmreq/names-chunk.xml 'namesRequest("@@CO@@", 111111, 222222)'
          one dbmreq/names-tail.xml 'namesRequest("@@CO@@", 111111, 0)'
          one dbmreq/ledlist-chunk.xml 'ledgerChunkRequest("@@CO@@", 111111, 222222)'
          one dbmreq/ledlist-tail.xml 'ledgerChunkRequest("@@CO@@", 111111, 0)'
          one dbmreq/ledids-chunk.xml 'fcCollection("FinComLedgerIds", "@@CO@@", "", "Ledger", "MASTERID", masterRange(111111, 222222))'
          one dbmreq/ledids-tail.xml 'fcCollection("FinComLedgerIds", "@@CO@@", "", "Ledger", "MASTERID", masterRange(111111, 0))'
          one dbmreq/company-check.xml 'companyCheckRequest("@@CO@@")'
          one dbmreq/entry-object.xml 'voucherObjectRequest("@@CO@@", "99999")'
          # proof72: the FinCom id check (FinComTag: one date's heads and narration) and the read-back by MasterID
          # (FinComByMaster), as the ref builds them (both on the allow-list; the bridge sends them for the read test / Check Tally)
          one dbmreq/tagcheck.xml 'tagCheckRequest("@@CO@@", "20991231")'
          one dbmreq/bymaster.xml 'masterCheckRequest("@@CO@@", "20991231", "20991231", "99999")'
          echo "Written by a go test at $(git rev-parse HEAD) (the ref): dayBookRequestForm x4, datesProbeRequest x7, vchHeadsRequest, namesRequest, ledgerChunkRequest, FinComLedgerIds (candidate L3, fcCollection), companyCheckRequest, voucherObjectRequest" > dist/dbmreq/SOURCE.txt
          # dbm / dbres test data: ZZ BIG TEST's masters and vouchers from its own generator at the ref, re-dated by the
          # harness onto Educational-mode days (harness/.github/tally-spike/dbm/redate.py)
          # (the harness checkout is gone once the ref is checked out at the root: redate.py is taken from this run's commit)
          # dbbig: the same, about 30,000 entries all in FY 2026-27 (DBM_PROFILE=big)
          case ",${{ steps.mode.outputs.modes }}," in *,dbbig,*|*,g245,*|*,proof72,*) export DBM_PROFILE=big ;; esac
          if [ -f ../tests/fixtures/big/make_big_company.py ] && git fetch -q --depth 1 origin ${{ github.sha }} && git show FETCH_HEAD:.github/tally-spike/dbm/redate.py > "$RUNNER_TEMP/redate.py"; then
            n=$(python3 "$RUNNER_TEMP/redate.py" --total)
            python3 ../tests/fixtures/big/make_big_company.py --vouchers "$n" --chunk 100000 --out dist/dbmgen > /dev/null
            python3 "$RUNNER_TEMP/redate.py" dist/dbmgen dist/dbm && cp dist/dbmgen/big-masters.xml dist/dbm/ && rm -rf dist/dbmgen && ls -la dist/dbm | head -5
          fi
          # tdsm: ZZ BIG TEST's masters, from its own generator at the ref (masters only are used)
          if [ -f ../tests/fixtures/big/make_big_company.py ]; then python3 ../tests/fixtures/big/make_big_company.py --vouchers 10 --chunk 10 --out dist/big > /dev/null && rm -f dist/big/big-vouchers-*.xml && ls -la dist/big; fi
          ls -la dist/ledreq dist/requests
      # tds240: the cloud's own parser at the ref (parse.js with server/_shared); selfck: migration 65 at the ref (its
      # tally_selfcheck_words gives the words the stub answers)
      - name: Cloud parser and migration 65 at the ref
        run: |
          mkdir -p bridge-go/dist/cloud/tally-cloud bridge-go/dist/cloud/_shared
          cp server/tally-cloud/parse.js bridge-go/dist/cloud/tally-cloud/
          cp server/_shared/*.js bridge-go/dist/cloud/_shared/ 2>/dev/null || true
          echo '{"type":"module"}' > bridge-go/dist/cloud/package.json
          cp server/tally-cloud/migration-65-selfchecks.sql bridge-go/dist/cloud/ 2>/dev/null || echo "no migration 65 at the ref"
          sha256sum bridge-go/dist/cloud/tally-cloud/parse.js bridge-go/dist/cloud/*.sql 2>/dev/null || true
      # upg: the published 2.3.3 (commit 91faf7f3, setup SHA-256 8280206b...e5e5) and its add-on, the install the gate's
      # setup goes over
      - name: Bridge 2.3.3 (upg)
        if: contains(steps.mode.outputs.modes, 'upg') && inputs.upg_from != '2.4.0' && inputs.upg_from != '2.4.1' && inputs.upg_from != '2.4.2' && inputs.upg_from != '2.4.3' && inputs.upg_from != '2.4.4' && inputs.upg_from != '2.4.5' && inputs.upg_from != '2.4.6'
        run: |
          git fetch -q --depth 1 origin 91faf7f3b04932e65624b8bff5072c7ffa62b8f9
          mkdir -p bridge-go/dist/old233
          git show FETCH_HEAD:assets-test/bridge-go/FinComBridge-Setup-2.3.3.exe > bridge-go/dist/old233/FinComBridge-Setup-2.3.3.exe
          git show FETCH_HEAD:bridge-go/addon/FinComRecorder.tdl > bridge-go/dist/old233/FinComRecorder.tdl
          got=$(sha256sum bridge-go/dist/old233/FinComBridge-Setup-2.3.3.exe | awk '{print $1}')
          [ "$got" = 8280206b1500742b892d41a658fdff809aa7eba219913611d929b7f8e9bee5e5 ] || { echo "::error::2.3.3 setup SHA-256 $got"; exit 1; }
          echo "2.3.3 setup SHA-256 $got"
      # upg_from=2.4.0 (2.4.1's gate): the published 2.4.0 (built at 3bf7b6d9, setup SHA-256 00ab8042...16dc) and its add-on
      - name: Bridge 2.4.0 (upg from 2.4.0)
