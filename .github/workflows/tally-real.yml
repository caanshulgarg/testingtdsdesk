# Spike: a real TallyPrime on GitHub's hosted Windows runner (branch tally-real-spike only).
# Round 4: bridge 2.3.0 (per-user bridges) built from a ref (input bridge_ref, default per-user-bridge) and proven on real
# Tally against a local stub cloud (stub.py): create, alter, Alt+2 copy, cancel, delete, and two bridges of two Windows
# users side by side (flow4.ps1). Results (log, stub lines, screenshots) are committed back under spike-results/<run>-<os>/
# and kept as an artifact. The job fails when any step fails.
name: Tally real spike
on:
  push:
    branches: [tally-real-spike]
    paths: ['.github/workflows/tally-real.yml', '.github/tally-spike/**']
  workflow_dispatch:
    inputs:
      bridge_ref:
        description: 'Branch, tag or commit of the bridge to build (bridge-go/)'
        default: per-user-bridge
      probe:
        description: 'yes: run probe.ps1 (screens and exports of Tally for the scenario list) instead of round 4'
        default: 'no'
permissions:
  contents: write
concurrency:
  group: tally-real-spike
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.bridge_ref || 'per-user-bridge' }}
      - id: sha
        run: |
          echo "sha=$(git rev-parse HEAD)" | tee -a "$GITHUB_OUTPUT"
          git log -1 --format='bridge source: %H %s' | tee bridge-source.txt
      # the setup committed at the ref (assets-test/bridge-go/FinComBridge-Setup-<version>.exe, with its .sha256) is the
      # one installed when there is one: the exact file that ships; building from source is the fallback
      - name: Committed setup at the ref
        id: committed
        run: |
          # only the setup of the ref's own version (BridgeVersion in bridge-go/util.go): a branch that carries an older
          # committed setup (a-231 / b-231 / items-231 keep 2.3.0's) is built from source
          ver=$(grep -oP 'var BridgeVersion = "\K[0-9.]+' bridge-go/util.go || true)
          f=$(ls assets-test/bridge-go/FinComBridge-Setup-$ver.exe 2>/dev/null | head -1 || true)
          echo "the ref's BridgeVersion: $ver; committed setups: $(ls assets-test/bridge-go/FinComBridge-Setup-*.exe 2>/dev/null | tr '\n' ' ')"
          if [ -z "$ver" ] || [ -z "$f" ]; then echo "no committed setup of version $ver at the ref: building from source"; echo "use=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ -f "$f.sha256" ] || { echo "::error::$f has no $f.sha256 next to it"; exit 1; }
          want=$(awk '{print tolower($1); exit}' "$f.sha256"); got=$(sha256sum "$f" | awk '{print $1}')
          echo "committed setup $f: SHA-256 $got (expected from $(basename "$f").sha256: $want)"
          [ "$want" = "$got" ] || { echo "::error::committed setup SHA-256 mismatch: $got, expected $want"; exit 1; }
          mkdir -p bridge-go/dist && cp "$f" bridge-go/dist/ && cp bridge-go/addon/FinComRecorder.tdl bridge-source.txt bridge-go/dist/
          echo "setup origin: COMMITTED $f SHA-256 $got" | tee bridge-go/dist/setup-origin.txt
          echo "use=yes" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version-file: bridge-go/go.mod
          cache-dependency-path: bridge-go/go.sum
      - name: NSIS (makensis)
        if: steps.committed.outputs.use != 'yes'
        run: sudo apt-get update -q && sudo apt-get install -y -q nsis
      - name: Program and setup (built only to be tested here)
        if: steps.committed.outputs.use != 'yes'
        working-directory: bridge-go
        run: |
          FORCE_REBUILD=1 ./build.sh
          cp addon/FinComRecorder.tdl dist/
          cp ../bridge-source.txt dist/
          f=$(ls dist/FinComBridge-Setup-*.exe | head -1)
          echo "setup origin: BUILT from source $f SHA-256 $(sha256sum "$f" | awk '{print $1}')" | tee dist/setup-origin.txt
      # the owner's 2.3.1 scenarios: the bridge's own requests to Tally, as its code at the ref builds them, printed by throwaway
      # test files that live only in this checkout (never committed; the bridge's code is not changed): the one-entry request
      # (voucherByMasterRequest; MasterID 99999 and the day 20261001 are placeholders the harness replaces), and, from b-231,
      # the ledger requests (ledgerChangesRequest with the span 77777..88888, ledgerByNameRequest with the name FCSPIKENAME).
      # Each is built on its own, so a ref without one of them (a-231 has no ledger requests) still gives the others
      - name: The bridge's own requests (for the 2.3.1 scenarios)
        continue-on-error: true
        working-directory: bridge-go
        run: |
          mkdir -p dist/requests
          one() {
            printf 'package main\n\nimport (\n\t"os"\n\t"testing"\n)\n\nfunc TestFCSpikeReq(t *testing.T) {\n\tif err := os.WriteFile(os.Getenv("FC_REQ_OUT"), []byte(%s), 0o644); err != nil {\n\t\tt.Fatal(err)\n\t}\n}\n' "$2" > zz_fcspike_req_test.go
            if FC_REQ_OUT="$PWD/dist/requests/$1.xml" go test -run '^TestFCSpikeReq$' -count=1 . > "dist/requests/$1.log" 2>&1; then echo "$1: $(head -c 300 dist/requests/$1.xml)"; else echo "$1: not at this ref ($(grep -m1 -E 'undefined|error' dist/requests/$1.log))"; rm -f dist/requests/$1.xml; fi
            rm -f zz_fcspike_req_test.go
          }
          one entry 'voucherByMasterRequest("FinCom Spike Co", "20261001", []string{"99999"})'
          one ledger-changes 'ledgerChangesRequest("FinCom Spike Co", 77777, 88888)'
          one ledger-by-name 'ledgerByNameRequest("FinCom Spike Co", "FCSPIKENAME")'
          ls -la dist/requests
      # check 7: the cloud's own parser at the ref (tally-ingest's parse.js and the names rule it imports), run under node
      - name: Cloud parser at the ref
        run: |
          mkdir -p bridge-go/dist/cloud/tally-cloud bridge-go/dist/cloud/_shared
          cp server/tally-cloud/parse.js bridge-go/dist/cloud/tally-cloud/
          cp server/_shared/*.js bridge-go/dist/cloud/_shared/
          echo '{"type":"module"}' > bridge-go/dist/cloud/package.json
          sha256sum bridge-go/dist/cloud/tally-cloud/parse.js bridge-go/dist/cloud/_shared/*.js
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-dist
          path: bridge-go/dist/
          if-no-files-found: error

  tally:
    needs: build
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    env:
      RES: ${{ github.workspace }}\spike-results\${{ github.run_id }}-${{ matrix.os }}
      SHOTS: ${{ github.workspace }}\spike-results\${{ github.run_id }}-${{ matrix.os }}
      LOG: ${{ github.workspace }}\spike-results\${{ github.run_id }}-${{ matrix.os }}\log.txt
      BRIDGE_SHA: ${{ needs.build.outputs.sha }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: bridge-dist
          path: bridge-dist
      - name: Desktop check
        run: |
          New-Item -ItemType Directory -Force $env:RES | Out-Null
          & { "== desktop check"; whoami; (query user 2>&1); "UserInteractive=$([Environment]::UserInteractive)"; "session=$((Get-Process -Id $PID).SessionId)"
              Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version | Out-String
              & .github/tally-spike/shot.ps1 desktop-0 } *>&1 | Tee-Object -FilePath $env:LOG -Append
          exit 0
      - name: 1 Download installer
        run: |
          & .github/tally-spike/resolve.ps1 *>&1 | Tee-Object -FilePath $env:LOG -Append; exit $LASTEXITCODE
      - name: 2 Install
        run: |
          & .github/tally-spike/install.ps1 *>&1 | Tee-Object -FilePath $env:LOG -Append; exit $LASTEXITCODE
      - name: 3-5 Start Tally, port 9000, company, TDL
        continue-on-error: true
        run: |
          & .github/tally-spike/flow.ps1 *>&1 | Tee-Object -FilePath $env:LOG -Append; exit 0
      - name: Probe (screens and Tally's own exports, no checks)
        if: inputs.probe == 'yes'
        run: |
          & .github/tally-spike/probe.ps1 *>&1 | Tee-Object -FilePath "$env:RES\probe.log" -Append; exit 0
      - name: Round 4 (the bridge from the ref, two Windows users, a local stub cloud; the 2.3.1 scenarios S1-S10)
        if: inputs.probe != 'yes'
        env:
          BRIDGE_DIST: ${{ github.workspace }}\bridge-dist
        run: |
          & .github/tally-spike/flow4.ps1 *>&1 | Tee-Object -FilePath "$env:RES\round4.log" -Append
          $r = Join-Path $env:RES 'round4\results.txt'
          if (Test-Path $r) { Get-Content $r | ForEach-Object { if ($_ -like 'FAIL*') { Write-Host "::error::$_" } elseif ($_ -like 'HARNESS*') { Write-Host "::error title=harness failure (not the bridge)::$_" } else { Write-Host "::notice::$_" } } }
          if (-not (Test-Path $r) -or (Select-String -Path $r -Pattern '^FAIL' -Quiet)) { exit 1 }
          if (Select-String -Path $r -Pattern '^HARNESS' -Quiet) { Write-Host 'harness failure: the test harness, not the bridge, failed (no bridge FAIL line)'; exit 2 }
          exit 0
      - name: Artifact (stub lines, screenshots, logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round4-${{ github.run_id }}
          path: spike-results/${{ github.run_id }}-${{ matrix.os }}/
      - name: Commit results back to the branch
        if: always()
        run: |
          Get-Process tally -ErrorAction SilentlyContinue | Stop-Process -Force
          git config user.name "tally-spike"; git config user.email "tally-spike@users.noreply.github.com"
          git status --short | Select-Object -First 20
          git add spike-results
          # the real XML Tally gave to the bridge's own requests in the 2.3.1 scenarios, for the bridge's tests
          if (Test-Path bridge-go/testdata/real-tally-7.1/231) { git add bridge-go/testdata/real-tally-7.1/231 }
          git commit -q -m "spike results ${{ github.run_id }} ${{ matrix.os }} (bridge ${{ needs.build.outputs.sha }})`n`nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>`nClaude-Session: https://claude.ai/code/session_01LprHoXx2ACgDW2AjxNH8wN"
          # anything else the job left changed in tracked files (seen: app/src/Main.jsx) is dropped: it stopped the rebase
          # in run 37393792265 when the branch had moved meanwhile
          git checkout -- .
          for ($i = 0; $i -lt 5; $i++) {
            git pull -q --rebase --autostash origin tally-real-spike
            git push -q origin HEAD:refs/heads/tally-real-spike
            if ($LASTEXITCODE -eq 0) { break }; Start-Sleep 5
          }
