<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="FinCom: read purchase bills and bank statements, work out TDS and GST, and post the entries to Tally.">
<meta name="theme-color" content="#1E2A25">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231F6F5C'/%3E%3Cpath d='M11 9v14M11 9h11M11 16h8' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<title>FinCom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
<style id="app-style">{{CSS}}</style>
</head>
<body>
<a class="skip" id="skipLink" href="#app">Skip to the work</a>
<div class="shell">
<nav class="side" id="side" aria-label="Main"></nav>
<div class="mainwrap">
<header class="top">
  <div class="wrap">
    <div class="toprow">
      <div class="brand">
        <h1>FinCom</h1>
        <p id="firmLine"></p>
      </div>
      <div class="cobar" id="cobar"></div>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="app"><p class="note">Loading…</p></main>
</div>
</div>
<div id="modal" class="hidden"></div>
<div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileIn" accept="application/pdf,image/*,.jpg,.jpeg,.jfif,.png,.webp,.heic" multiple class="hidden">
<input type="file" id="camIn" accept="image/*" capture="environment" class="hidden">
<input type="file" id="tallyIn" accept=".xml" multiple class="hidden">
<input type="file" id="booksIn" accept=".xml" class="hidden">
<input type="file" id="marketIn" accept=".csv,.txt,.xlsx,.xls" class="hidden">
<input type="file" id="salaryIn" accept=".csv,.txt,.xlsx,.xls" class="hidden">
<input type="file" id="mastersIn" accept=".xml" class="hidden">
<input type="file" id="tbCheckIn" accept=".xml" class="hidden">
<input type="file" id="multiBooksIn" accept=".xml" multiple class="hidden">
<input type="file" id="tbIn" accept=".xml" class="hidden">
<input type="file" id="filedIn" accept=".json,application/json" multiple class="hidden">
<input type="file" id="twoBIn" accept=".json,application/json" multiple class="hidden">

<!-- Libraries, served from assets/ on this site: pdf.js 4.10.38 and SheetJS CE 0.20.3 (Apache License 2.0), Tesseract core 5.1.1 (Apache License 2.0) -->
<script>window.TDS_ASSETS = "assets/";
// not inside another site's frame (clickjacking); claude.ai may show its own copy
(function(){ try { if (window.top === window.self) return; } catch (e){}
  var a = (location.ancestorOrigins && Array.prototype.slice.call(location.ancestorOrigins)) || [];
  if (a.some(function(o){ return o !== location.origin && !/(^|\.)(claude\.ai|claudeusercontent\.com|anthropic\.com)$/.test(String(o).replace(/^https?:\/\//, "").replace(/:\d+$/, "")); }))
    document.documentElement.style.display = "none"; })();</script>
<script id="app-main">{{JS}}</script>
</body>
</html>
