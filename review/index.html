/* the page: the FinCom mark while the program loads (only when it takes more than 300 ms, for at most a second, and never
   when this build has opened here before), then the page's shape */
.boot-page{position:relative;min-height:calc(100vh - 140px)}

.boot-mark{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#4F46E5,#7C3AED);color:#fff;
